# Settings of the override simulation.
#
# This is the override simulation's own config file. It sits next to the five
# calendar-bench experiment files (environment, event_config, persona_config,
# temporal_relation_rules, scenarios) and points at the experiment that
# generated the .ics calendars, so the simulation uses the same horizon,
# time windows, event catalog, personas and temporal rules.
#
# The D-numbers refer to the design decisions in docs/REPORT.md.
#
# NOTE: all probabilities and coefficients below are ASSUMPTIONS for
# version 1. They are not fitted to data. Report them as such and run a
# sensitivity analysis on them.

# calendar-bench experiment folder; relative to this file.
experiment_dir: ../calendar_bench_configs/experiments/healthy_lifestyle_promotion

# Horizon of the simulation.
#   experiment : start_date + weeks from environment.yaml (recommended)
#   calendar   : first to last planned task in the .ics file
horizon_source: experiment

# D1: Poisson arrivals of override events.
arrivals:
  rate_per_hour: 0.4   # lambda of the Poisson process

# D14: replications. Replication r (0 .. R-1) uses seed base_seed + r for
# its arrivals, notifications and decisions (three separate random streams).
replications:
  count: 30
  base_seed: 42
  confidence_level: 0.95   # only 0.95 is supported

# D12: output. Files are written next to the .ics file unless dir is set
# (dir is relative to this file).
output:
  dir: null
  executed_ics_replications: 1   # write an executed .ics for the first N runs

# D3, D4, D5, D6, D9, D10, D15: the override model.
override_model:
  default:
    # D3/D4: multinomial logit with "no override" as reference.
    # Base probabilities = probabilities when fill = 0, no earlier overrides
    # and no notification. The intercepts are ln(p_action / p_none).
    base_probabilities:
      postpone: 0.12
      skip: 0.08
      replace: 0.05          # p_none = 1 - sum = 0.75

    # Coefficients per action (log-odds against "no override").
    #   fill              D6: planned hours left in the day (per hour)
    #   earlier_overrides D5: overrides earlier in the window; negative =
    #                     an earlier override LOWERS the next override chance
    #   notified          D10: 1 if the task has a notification
    coefficients:
      postpone: { fill: 0.10, earlier_overrides: -0.40, notified: -0.30 }
      skip:     { fill: 0.08, earlier_overrides: -0.40, notified: -0.50 }
      replace:  { fill: 0.05, earlier_overrides: -0.40, notified: -0.20 }

    earlier_overrides_window: day   # day | run | <number of hours>
    earlier_overrides_cap: 3        # count above this is treated as 3

    # D10: share q of tasks that get a notification, drawn at random.
    notification_share: 0.5

    # D7 (rule-based): a task can be postponed at most this many times; after
    # that only skip / replace / no override remain. A postponed task goes to
    # the next free slot on the same day; without a free slot it is skipped.
    max_postpones_per_task: 1
    check_temporal_rules: true      # new slot must respect temporal_relation_rules.yaml

    # D9 (rule-based): explicit list of tasks that never get an override.
    # Fixed and physiological events, the meals, and meetings.
    excluded:
      events:
        - sleep
        - napping
        - wake_up
        - go_to_bed
        - breakfast
        - lunch
        - dinner
        - snacking
        - drink_water
        - meeting
      labels:            # office_work labels that are meetings
        - standup
        - external meeting
      categories: []

  # D15: parameter sets per persona. The persona is read from the calendar
  # (person id diligent_anxious_active_0000 -> diligent_anxious_active).
  # A persona set only lists what differs from `default`.
  personas:
    diligent_anxious_active:      # high conscientiousness: plans are kept
      base_probabilities: { postpone: 0.10, skip: 0.05, replace: 0.03 }
    free_spirited_social_student: # low structure, spontaneous
      base_probabilities: { postpone: 0.15, skip: 0.12, replace: 0.10 }
      notification_share: 0.3
    unemployed_family_caregiver:  # care duties interrupt plans
      base_probabilities: { postpone: 0.12, skip: 0.10, replace: 0.08 }
